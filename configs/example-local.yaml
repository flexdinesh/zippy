# Example configuration for local backup destination

# Cron schedule (runs daily at 2 AM)
schedule: "0 2 * * *"

# Source directories to backup
sources:
  - /data
  - /app/config

# Destination configuration
destination:
  type: local
  path: /backups
  prefix: backup-  # Optional: prefix for backup files

# Retention policy (Grandfather-Father-Son)
retention:
  daily: 7     # Keep 7 daily backups
  weekly: 4    # Keep 4 weekly backups
  monthly: 12  # Keep 12 monthly backups

# Compression type (optional, defaults to gzip)
# Options: gzip, zstd, none
compression: gzip
