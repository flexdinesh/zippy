# Example configuration for S3 backup destination

# Cron schedule (runs daily at 2 AM)
schedule: "0 2 * * *"

# Source directories to backup
sources:
  - /data
  - /app/config

# Destination configuration
destination:
  type: s3
  path: my-backup-bucket
  prefix: backups/  # Optional: prefix for backup files in bucket

  # S3-specific configuration
  s3:
    region: us-east-1
    # endpoint: https://s3.amazonaws.com  # Optional: custom endpoint for S3-compatible storage
    # access_key_id: YOUR_ACCESS_KEY      # Optional: can use IAM role instead
    # secret_access_key: YOUR_SECRET_KEY  # Optional: can use IAM role instead

# Retention policy (Grandfather-Father-Son)
retention:
  daily: 7     # Keep 7 daily backups
  weekly: 4    # Keep 4 weekly backups
  monthly: 12  # Keep 12 monthly backups

# Compression type (optional, defaults to gzip)
# Options: gzip, zstd, none
compression: gzip
